name: app_google_sign_in
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.12.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  google_sign_in_android: ^6.2.1
  google_sign_in_ios: ^5.9.0
  google_sign_in_platform_interface: ^2.5.0

flutter:
  plugin:
    platforms:
      android:
        dartPluginClass: AppGoogleSignInPlugin
      ios:
        dartPluginClass: AppGoogleSignInPlugin
      macos:
        dartPluginClass: AppGoogleSignInPlugin
