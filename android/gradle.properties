org.gradle.jvmargs=-Xmx3500m -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC
# 限制同时执行的 Gradle 任务数（Windows 32G 内存下避免 OOM）
org.gradle.workers.max=2
# 启用守护进程
org.gradle.daemon=true
# 关闭并行项目构建
org.gradle.parallel=false
# 不按需配置
org.gradle.configureondemand=false
android.useAndroidX=true
android.enableJetifier=true
# 启用 Built-in Kotlin（新模式，不再依赖旧 KGP）
# 【背景】Flutter 3.x 默认开启此模式
# 【修复】device_info_plus / share_plus 等 KGP 插件
#         在 builtInKotlin=true 下能稳定编译
android.builtInKotlin=true
# 启用 Android 新 Gradle DSL
android.newDsl=true
