plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

apply from: "mobsdk.gradle"

android {
    namespace = "com.video.storydrama"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def storeFilePath = keystoreProperties.getProperty("storeFile")
            if (storeFilePath != null && !storeFilePath.isEmpty()) {
                storeFile new File(keystorePropertiesFile.parent, storeFilePath)
                storePassword keystoreProperties.getProperty("storePassword")
                keyAlias keystoreProperties.getProperty("keyAlias")
                keyPassword keystoreProperties.getProperty("keyPassword")
            }
        }
    }

    defaultConfig {
        applicationId "com.video.storydrama"
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    flavorDimensions = ["distribution"]

    productFlavors {
        google {
            dimension "distribution"
            applicationIdSuffix ""
            versionNameSuffix "-g"
            resValue "string", "app_name", "Qahwa TV"
        }
        platform {
            dimension "distribution"
            applicationIdSuffix ""
            versionNameSuffix "-p"
            resValue "string", "app_name", "Kaffa Reels"
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            // 启用 R8 但配置为不做任何移除或混淆
            minifyEnabled false
            shrinkResources false
            // 显式配置 R8 不进行优化
            project.ext.set("flutter.minifierEnabled", false)
        }
        debug {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    // 【Play Billing Library 版本】
    //
    // 这里写的版本必须和 in_app_purchase_android 实际依赖的一致，否则是**无效声明**：
    // Gradle 的依赖冲突默认取「最高版本」，插件 0.5.2 内部依赖 billing:8.0.0，
    // 所以之前写的 6.2.0 从未生效过，打包进去的一直是 8.0.0。
    //
    // 不能降级的原因：
    //   从 2026-08-31 起（Play Console 口径为 2026-11-01），Google 要求
    //   新应用和更新必须使用 Billing Library 8 或更高，降到 6.2.0 / 7.1.1
    //   会导致无法上传 Google Play。
    //
    // 想真正降级必须同时降插件版本：
    //   billing 8.0.0 → in_app_purchase_android 0.5.x
    //   billing 7.1.1 → in_app_purchase_android 0.4.0+11
    //   billing 6.2.0 → in_app_purchase_android 0.3.6+13
    // （0.4.x 没有 unfetchedProductList，play_billing_probe.dart 需要适配）
    implementation "com.android.billingclient:billing:8.0.0"
    // Meta Facebook Login SDK
    implementation 'com.facebook.android:facebook-login:17.0.2'
    implementation 'com.facebook.android:audience-network-sdk:6.17.0'
}

// ============================================================================
// 【Google Play 政策】剔除 MobSDK 动态注入的 QUERY_ALL_PACKAGES
//
// 背景：AndroidManifest.xml 里已经用 tools:node="remove" 声明移除该权限，
// 第一轮清单合并（processXXXMainManifest）确实是干净的；但 MobSDK 的
// Gradle 插件会在**合并之后的清单任务**（processXXXManifest /
// processXXXManifestForPackage / processApplicationManifestXXXForBundle）
// 中把它重新注入最终清单，tools:node="remove" 拦不住这种动态注入。
//
// 做法：给所有清单处理任务挂 doLast，在任务输出落盘后把该权限行删掉。
// 这些任务完成后才轮到 bundle/packager 读清单，因此打出来的
// AAB/APK 最终不含 QUERY_ALL_PACKAGES。
// ============================================================================
def stripQueryAllPackages(File file) {
    if (!file.exists()) return
    def text = file.getText('UTF-8')
    def cleaned = text.replaceAll(
            /<uses-permission\s+android:name="android\.permission\.QUERY_ALL_PACKAGES"\s*\/>/, '')
    if (cleaned != text) {
        file.write(cleaned, 'UTF-8')
        println "[ManifestStrip] removed QUERY_ALL_PACKAGES from ${file.path}"
    }
}

// 注意：MobSDK 插件是在 afterEvaluate 阶段往清单任务上追加自己的 doLast
// （mobsdk.gradle 在本文件第 14 行 apply，其回调先注册，先执行）。
// 我们的剔除钩子必须在它之后执行，所以把 doLast 的注册也放进
// afterEvaluate —— 本文件写在 android{} 之后，回调注册晚于 MobSDK，
// doLast 队列顺序：MobSDK 注入 → 本钩子剔除。✔
afterEvaluate {
    tasks.matching { it.name ==~ /process\w*Manifest\w*/ }.configureEach { task ->
        task.doLast {
            task.outputs.files.each { f ->
                if (f.isDirectory()) {
                    f.eachFileRecurse { entry ->
                        if (entry.name == 'AndroidManifest.xml') {
                            stripQueryAllPackages(entry)
                        }
                    }
                } else if (f.name == 'AndroidManifest.xml') {
                    stripQueryAllPackages(f)
                }
            }
        }
    }
}
