<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Login Callback</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      background: #fafafa;
      color: #111;
    }
    .card {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 12px;
      font-weight: 600;
    }
    .status {
      font-size: 14px;
      color: #666;
      margin: 8px 0 16px;
    }
    .status.success { color: #00875a; }
    .status.error { color: #d72c0d; }
    pre {
      text-align: left;
      background: #f4f4f5;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      overflow-x: auto;
      word-break: break-all;
      white-space: pre-wrap;
      margin: 0;
    }
    .footer {
      margin-top: 16px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="callback-status">
    <h1>TikTok Login</h1>
    <p class="status" id="status">Processing authorization response...</p>
  </div>

  <script>
    (function () {
      'use strict';

      const params = new URLSearchParams(window.location.search);
      const statusEl = document.getElementById('status');
      const error = params.get('error');
      const code = params.get('code');

      // Authorization values must not remain in browser history or the address bar.
      window.history.replaceState({}, document.title, window.location.pathname);

      // 【Flutter Web 弹窗流】本页是 TikTok 回调页。App 以弹窗方式打开授权页，
      // TikTok 302 回本页后，把 code/state/error 以 JSON 字符串 postMessage
      // 回 opener（App 监听并校验 state），然后自关弹窗。
      // 直接在浏览器打开（无 opener）时仍然显示诊断信息。
      if (window.opener) {
        try {
          window.opener.postMessage(
            JSON.stringify({
              source: 'qahwa-tiktok-login',
              code: code,
              state: params.get('state'),
              error: error || (code ? null : 'missing_code'),
            }),
            '*'
          );
        } catch (e) { /* opener 不可达（跨域已关闭等），走下方提示 */ }
        setTimeout(function () { window.close(); }, 300);
        if (error) {
          statusEl.textContent = 'Login failed. Closing...';
          statusEl.className = 'status error';
        } else if (code) {
          statusEl.textContent = 'Authorization received. Closing...';
          statusEl.className = 'status success';
        } else {
          statusEl.textContent = 'No authorization response. Closing...';
          statusEl.className = 'status error';
        }
        return;
      }

      if (error) {
        statusEl.textContent = 'Login failed. Return to the app and try again.';
        statusEl.className = 'status error';
      } else if (code) {
        statusEl.textContent = 'Login response received. Return to the app to continue.';
        statusEl.className = 'status success';
      } else {
        statusEl.textContent = 'No authorization response was received.';
        statusEl.className = 'status error';
      }
    })();
  </script>
</body>
</html>
