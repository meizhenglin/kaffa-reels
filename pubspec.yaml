name: arab_drama_app
description: "Arabic Drama App - A short drama streaming application for Arabic region."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  riverpod: ^2.5.0
  flutter_riverpod: ^2.5.0

  # Routing
  go_router: ^14.0.0

  # Network
  dio: ^5.4.0
  retrofit: ^4.1.0

  # Logging
  logger: ^2.0.0

  # Storage
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0

  # Localization
  intl: ^0.20.2

  # Utilities
  equatable: ^2.0.0
  uuid: ^4.2.0
  json_annotation: ^4.9.0
  carousel_slider: ^5.0.0

  # Firebase & Auth
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.0
  sign_in_with_apple: ^6.0.0
  email_validator: ^3.0.0

  # Image Picker
  image_picker: ^1.0.7

  # URL Launcher
  url_launcher: ^6.2.5
  path_provider: ^2.1.0

  # 阿里云播放器（6.15.x 要求 SDK<=3.5.3，当前使用兼容版本）
  flutter_aliplayer: ^7.0.0
  aliplayer_widget: ^7.0.0
  preload_page_view: ^0.2.0
  screen_brightness: ^2.0.2

  # Payment & Subscription
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  retrofit_generator: ^9.1.5
  build_runner: ^2.4.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/cert/
    - assets/data/
    - assets/videos/
