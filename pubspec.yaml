name: qahwa_tv
description: "QahwaTV App - A short drama streaming application for Arabic region."
publish_to: 'none'

version: 1.0.6+15

environment:
  sdk: ^3.12.0  # 改成 3.12.0 

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  riverpod: ^2.5.0
  flutter_riverpod: ^2.5.0

  # Routing
  go_router: ^14.0.0

  # Network
  dio: ^5.4.0
  retrofit: ^4.1.0

  # Logging
  logger: ^2.0.0

  # Storage
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.2.2

  # Localization
  intl: ^0.20.2

  # Utilities
  equatable: ^2.0.0
  uuid: ^4.2.0
  json_annotation: ^4.9.0
  carousel_slider: ^5.0.0

  # Firebase & Auth
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  app_google_sign_in:
    path: packages/app_google_sign_in
  sign_in_with_apple: ^6.0.0
  email_validator: ^3.0.0

  # Image Picker
  image_picker: ^1.0.7
  device_info_plus: ^11.0.0

  # URL Launcher
  url_launcher: ^6.2.5
  
  # Share
  share_plus: ^10.0.0
  path_provider: ^2.1.0
  package_info_plus: ^8.0.2

  # 阿里云播放器（6.15.x 要求 SDK<=3.5.3，当前使用兼容版本）
  flutter_aliplayer: 7.14.0
  aliplayer_widget: 7.14.0
  preload_page_view: ^0.2.0

  # Payment & Subscription
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.1
  webview_flutter: ^4.10.0
  flutter_html: ^3.0.0
  sharesdk_plugin: ^1.3.20
  mobcommonlib: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0 
  retrofit_generator: ^9.1.5
  build_runner: ^2.4.0
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/cert/
    - assets/data/
