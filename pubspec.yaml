name: qahwa_tv
description: "Kaffa Reels App - A short drama streaming application for Arabic region."
publish_to: 'none'

version: 1.5.0+2045

environment:
  sdk: ^3.12.0  # 改成 3.12.0 

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  riverpod: ^2.5.0
  flutter_riverpod: ^2.5.0

  # Routing
  go_router: ^14.0.0

  # Network
  dio: ^5.4.0
  retrofit: ^4.1.0

  # Logging
  logger: ^2.0.0

  # Storage
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.2.2

  # Localization
  intl: ^0.20.2

  # Utilities
  equatable: ^2.0.0
  uuid: ^4.2.0
  json_annotation: ^4.9.0
  carousel_slider: ^5.0.0

  # Firebase & Auth
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  app_google_sign_in:
    path: packages/app_google_sign_in
  sign_in_with_apple: ^6.0.0
  email_validator: ^3.0.0

  # Image Picker
  image_picker: ^1.0.7
  device_info_plus: ^11.0.0

  # URL Launcher
  url_launcher: ^6.2.5
  
  # Share
  share_plus: ^10.0.0
  path_provider: ^2.1.0
  package_info_plus: ^8.0.2

  # 阿里云播放器（6.15.x 要求 SDK<=3.5.3，当前使用兼容版本）
  preload_page_view: ^0.2.0

  # Payment & Subscription
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.1
  # 直接依赖：play_billing_probe.dart 需要 InAppPurchasePlatform.instance
  # 才能拿到插件内部的 BillingClient 原始 BillingResult。
  in_app_purchase_platform_interface: ^1.4.1
  webview_flutter: ^4.10.0

  # TikTok 登录页需要「多窗口」能力：TikTok 的 Google 登录走 Google Identity
  # Services 的弹窗流程（window.open + postMessage 给 window.opener），
  # webview_flutter 只渲染单窗口、不支持弹窗，会让流程停在
  # accounts.google.com/gsi/transform 白屏。flutter_inappwebview 支持
  # supportMultipleWindows / onCreateWindow，可以真正承接弹窗。
  flutter_inappwebview: ^6.1.5

  # TikTok 登录的 PKCE code_challenge（SHA-256）
  crypto: ^3.0.7
  flutter_html: ^3.0.0
  sharesdk_plugin: ^1.3.20
  mobcommonlib: ^1.1.7

  # AdMob & Meta Ads
  google_mobile_ads: ^5.0.0
  # Native browser/HTML5 video player used by the platform Web build
  video_player: ^2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0 
  retrofit_generator: ^9.1.5
  build_runner: ^2.4.0
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.3
  # tool/build.dart 用它把 Web 构建产物打成带版本号的 zip
  archive: ^4.0.9

dependency_overrides:
  # flutter_html 3.0.0 已停止维护，与 html>=0.15.5 不兼容
  # （html 包移除了 QuerySelector.matches，导致 styled_element.dart 编译失败）
  html: 0.15.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/APP_LOGO_NEW_purple.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/APP_LOGO_NEW_purple.png"
  web:
    generate: true
    image_path: "assets/images/APP_LOGO_NEW_purple.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/cert/
    - assets/data/
    - assets/js/
