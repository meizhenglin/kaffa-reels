# ============================================================================
# Codemagic CI —— iOS 构建配置
#
# 【为什么要这个文件】你在 Windows 上开发，本地无法编 iOS（需要 macOS + Xcode）。
# Codemagic 提供 macOS 云机器，push 代码后自动出包：
#   - ios-simulator-debug : 不签名，出模拟器包（功能验证，不需要苹果账号配置）
#   - ios-app-store       : 签名出 .ipa（可上传 TestFlight / App Store）
#
# 【首次使用前必须做（Codemagic 网页控制台）】
# 1. 把本仓库接入 Codemagic（Team settings → Repositories / Add application）
# 2. 配置 App Store Connect API 集成：
#      Teams → Codemagic API settings → App Store Connect → 连接
#    需要 Apple 后台生成的 API Key（Issuer ID / Key ID / .p8 私钥）
# 3. 如果 bundle id / capability 变了，去 Apple Developer 后台确认
#    App ID `com.playlet.qahwatvshorts` 已勾选：
#      Sign In with Apple + Associated Domains
#    （xcode-project use-profiles 会自动选带这些 capability 的 profile）
#
# 【代码侧前置条件（提交前必须完成，CI 代替不了）】
# - firebase_options.dart 已用 flutterfire configure 生成真实值
# - ios/Runner/GoogleService-Info.plist 已加入工程（firebase 需要时）
# - ios/Podfile 已存在（本仓库已有）
# ============================================================================

workflows:

  # ------------------------------------------------------------------
  # 工作流 1：iOS 模拟器 Debug 包（免签名，验证功能用）
  # ------------------------------------------------------------------
  ios-simulator-debug:
    name: iOS Debug (device, unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.44.0          # 与本地开发环境一致（Dart 3.12.0）
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.playlet.qahwatvshorts
    cache:
      cache_paths:
        - $FLUTTER_HOME/.pub-cache
        - $HOME/.gradle
    triggering:
      events: [push, tag]
      branch_patterns:
        - pattern: 'recharge-new'
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Disable Swift Package Manager（google_mobile_ads 不支持 SPM）
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Get dependencies
        script: |
          flutter packages pub get

      - name: Run analyzer（警告不拦截）
        script: |
          flutter analyze || true

      # 注意：不能编 --simulator。mob_sharesdk / mobcommonlib 是二进制 SDK，
      # 只带真机切片（FBSDKLoginKit.xcframework 无 ios-arm64_x86_64-simulator），
      # 模拟器构建必然失败。这里编真机 debug 包（免签名）用于验证可编译性。
      #
      # 不用 `flutter build ios` 的原因：真机构建失败时 Flutter 会统一打印
      # "requires a selected Development Team"（flutter_tools 里 _missingDevelopmentTeam
      # 的兜底提示），把 xcodebuild 的真实报错盖掉。这里改成 config-only + 原生
      # xcodebuild，失败时把 error: 行完整打出来。
      - name: Build iOS device app（免签名）
        script: |
          set -e
          # iOS 端移除 Kakao 分享：sharesdk_plugin 的 podspec 硬编码了
          # ShareSDKPlatforms/Kakao 依赖，其内置的 KakaoSDKAuth 预编译二进制
          # 与 CocoaPods 解析的 Alamofire ABI 不匹配，链接期必报
          # "symbol(s) not found for architecture arm64"，且钉版本/静态链接均无法修复。
          # iOS 端本来就不注册 Kakao（init 只注册 Facebook/Twitter），移除安全；
          # Android 端走 gradle 不受影响。做法：在 pod install 之前改 pub cache 里的 podspec。
          PUB_CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          PODSPEC=$(find "$PUB_CACHE_DIR" -path "*sharesdk_plugin*/ios/sharesdk_plugin.podspec" 2>/dev/null | head -1)
          if [ -n "$PODSPEC" ]; then
            sed -i.bak '/ShareSDKPlatforms\/Kakao/d' "$PODSPEC"
            echo "✅ 已从 podspec 移除 iOS 端 Kakao 分享依赖: $PODSPEC"
          else
            echo "⚠️ 未找到 sharesdk_plugin.podspec，Kakao 依赖仍在"
          fi
          # --config-only 内部也会跑 pod install，但它失败时 Flutter 会吞掉真实报错，
          # 所以这里先跑一次（失败不拦截），再独立执行 pod install 记录完整日志
          flutter build ios --config-only --debug --no-codesign || true
          cd ios
          echo "=== 独立执行 pod install ==="
          set +e
          pod install > /tmp/pod.log 2>&1
          PSTATUS=$?
          if [ $PSTATUS -ne 0 ]; then
            echo "=== pod install 失败，日志最后 80 行 ==="
            tail -80 /tmp/pod.log
            echo ""
            echo "=== pod install 日志中的错误行 ==="
            grep -n -iE "\[!\]|error|conflict|could not" /tmp/pod.log | tail -30
            exit 1
          fi
          echo "✅ pod install 成功"
          set -e
          echo "=== Podfile.lock 中 Alamofire / Kakao 实际解析版本 ==="
          grep -iE "alamofire|kakaosdk" Podfile.lock || echo "(无匹配 = Kakao/Alamofire 已移除, 正常)"
          echo "=== Pods 目录里的 KakaoSDKAuth 是源码还是二进制 ==="
          ls Pods/KakaoSDKAuth 2>/dev/null && echo "(源码 pod)" || true
          ls Pods/mob_sharesdk/ShareSDK/Support/PlatformSDK/ 2>/dev/null | head -40
          set +e
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../build/ios_dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > /tmp/xcb.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "=== 去噪后的最后 100 行（过滤 deployment target 警告）==="
            grep -v "IPHONEOS_DEPLOYMENT_TARGET" /tmp/xcb.log | tail -100
            echo ""
            echo "=== 脚本阶段 / Flutter 相关行 ==="
            grep -n "PhaseScriptExecution\|xcode_backend\|Command PhaseScript\|nonzero exit" \
              /tmp/xcb.log | tail -15
            echo ""
            echo "=== error: 行 ==="
            grep -n "error:" /tmp/xcb.log | grep -v "statusOfValueForKey" | tail -20
            echo ""
            echo "=== Runner 链接命令（看 -framework 列表里有没有 Alamofire/KakaoSDKAuth）==="
            LN3=$(grep -n "Ld /Users/builder/clone/build.*Runner.debug.dylib" /tmp/xcb.log | head -1 | cut -d: -f1)
            [ -n "$LN3" ] && sed -n "$LN3,$((LN3+40))p" /tmp/xcb.log
            echo ""
            echo "=== Undefined symbols 段落 ==="
            LN4=$(grep -n "Undefined symbols" /tmp/xcb.log | head -1 | cut -d: -f1)
            [ -n "$LN4" ] && sed -n "$((LN4>3 ? LN4-3 : 1)),$((LN4+8))p" /tmp/xcb.log
            exit 1
          fi
          echo "✅ xcodebuild 成功"
          tail -3 /tmp/xcb.log

      - name: Check iOS 配置完整性（构建后自检）
        script: |
          set -e
          echo "=== Info.plist 关键项检查 ==="
          PLIST=ios/Runner/Info.plist
          for key in NSPhotoLibraryUsageDescription NSCameraUsageDescription \
                     GADApplicationIdentifier FacebookAppID FacebookClientToken; do
            grep -q "<key>$key</key>" $PLIST || echo "⚠️  Info.plist 缺少 $key"
          done
          echo "=== Entitlements 检查 ==="
          grep -q "applinks:tv.qahwatv.com" ios/Runner/Runner.entitlements \
            || echo "⚠️  entitlements 缺少 applinks:tv.qahwatv.com"
          grep -q "com.apple.developer.applesignin" ios/Runner/Runner.entitlements \
            || echo "⚠️  entitlements 缺少 Sign In with Apple"
          echo "=== firebase_options 占位符检查（应无输出）==="
          grep -n "YOUR_IOS_API_KEY\|com.yourcompany" lib/core/firebase/firebase_options.dart \
            || echo "✅ firebase_options 已配置"

    artifacts:
      - build/ios_dd/Build/Products/Debug-iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - your-email@example.com   # TODO: 改成你的邮箱
        notify:
          success: true
          failure: true

  # ------------------------------------------------------------------
  # 工作流 2：App Store 签名 .ipa（TestFlight / 提审用）
  # ------------------------------------------------------------------
  ios-app-store:
    name: iOS App Store (signed ipa)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: toffee-asc   # Codemagic 团队里配置的 ASC API 集成名
    environment:
      flutter: 3.44.0          # 与本地开发环境一致（Dart 3.12.0）
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.playlet.qahwatvshorts
      vars:
        BUNDLE_ID: com.playlet.qahwatvshorts
    cache:
      cache_paths:
        - $FLUTTER_HOME/.pub-cache
    triggering:
      events: [tag]
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Disable Swift Package Manager（google_mobile_ads 不支持 SPM）
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Get dependencies
        script: |
          flutter packages pub get

      - name: 移除 iOS 端 Kakao 分享依赖（KakaoSDKAuth 二进制与 Alamofire ABI 不匹配）
        script: |
          # 与工作流 1 相同的处理：改 pub cache 里的 podspec，在 pod install 之前生效。
          # iOS 端未注册 Kakao 平台，移除安全；Android 不受影响。
          PUB_CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          PODSPEC=$(find "$PUB_CACHE_DIR" -path "*sharesdk_plugin*/ios/sharesdk_plugin.podspec" 2>/dev/null | head -1)
          if [ -n "$PODSPEC" ]; then
            sed -i.bak '/ShareSDKPlatforms\/Kakao/d' "$PODSPEC"
            echo "✅ 已移除: $PODSPEC"
          else
            echo "⚠️ 未找到 sharesdk_plugin.podspec"
            exit 1
          fi

      - name: 手动签名（装证书 + 装 profile + 生成 exportOptions）
        script: |
          # 不用 xcode-project use-profiles 自动匹配（对 profile/证书绑定要求苛刻且
          # 失败时不给日志）。改为从 Codemagic 加密变量手动安装签名材料：
          #   CERT_PASSWORD        (.p12 密码, secret)
          #   CERTIFICATE_P12      (证书 .p12 的 base64 文本, secret)
          #   PROVISIONING_PROFILE (mobileprovision 的 base64 文本, secret)
          set -e
          test -n "$CERT_PASSWORD" && test -n "$CERTIFICATE_P12" && test -n "$PROVISIONING_PROFILE" \
            || { echo "❌ 缺少签名变量 CERT_PASSWORD / CERTIFICATE_P12 / PROVISIONING_PROFILE"; exit 1; }

          keychain initialize
          echo "$CERTIFICATE_P12" | base64 --decode > /tmp/cert.p12
          keychain add-certificates \
            --certificate-path /tmp/cert.p12 \
            --certificate-password "$CERT_PASSWORD"
          rm -f /tmp/cert.p12
          echo "=== 钥匙串中的签名身份 ==="
          security find-identity -v -p codesigning | grep "Apple Distribution" \
            || { echo "❌ 未找到 Apple Distribution 证书"; exit 1; }

          echo "$PROVISIONING_PROFILE" | base64 --decode > /tmp/profile.mobileprovision
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PLIST=$(mktemp -u).plist
          security cms -D -i /tmp/profile.mobileprovision > "$PROFILE_PLIST"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          rm -f "$PROFILE_PLIST"
          cp /tmp/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          rm -f /tmp/profile.mobileprovision
          echo "✅ profile 已安装: $PROFILE_NAME ($PROFILE_UUID)"

          cat > "$HOME/export_options.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.playlet.qahwatvshorts</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          echo "✅ export_options.plist 已生成"

      - name: Build & sign ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=$HOME/export_options.plist

      - name: Verify signing
        script: |
          set -e
          IPA=$(find build/ios/ipa -name "*.ipa")
          test -n "$IPA" || { echo "❌ 没找到 ipa"; exit 1; }
          echo "✅ 产出: $IPA"
          # 校验 entitlements 真的进了签名
          unzip -o -q "$IPA" -d /tmp/ipa_check
          codesign -d --entitlements - /tmp/ipa_check/Payload/Runner.app \
            | grep -E "applesignin|associated-domains" \
            || echo "⚠️  签名里没有 Sign In with Apple / Associated Domains entitlement"

    artifacts:
      - build/ios/ipa/*.ipa
    # 构建成功后自动上传 TestFlight（需要先在 Codemagic 配好 App Store Connect API key 集成）
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers          # TestFlight 内测组名（需与 ASC 里的组名一致）
      email:
        recipients:
          - your-email@example.com    # TODO: 构建结果通知邮箱，改成你的
